dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.16.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.0
  path_provider_platform_interface: ^2.0.0
  plugin_platform_interface: ^2.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/dataset.isar
